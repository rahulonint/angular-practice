<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>Add a Tourism Place</mat-card-title>
    <mat-card-subtitle>Enter the details of the new destination</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form class="tourism-form"
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    >

      <!-- Place Name Input -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Place Name</mat-label>
        <input matInput placeholder="e.g., Machu Picchu" 
        formControlName="placeName"
        >
      </mat-form-field>

      <!-- Location Input -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Location</mat-label>
        <input matInput placeholder="e.g., Cusco Region, Peru" 
        formControlName="location">
      </mat-form-field>

      <!-- Category Select Dropdown -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Category</mat-label>
        <mat-select formControlName="category">
          <mat-option value="historical">Historical</mat-option>
          <mat-option value="nature">Nature</mat-option>
          <mat-option value="adventure">Adventure</mat-option>
          <mat-option value="cultural">Cultural</mat-option>
          <mat-option value="religious">Religious</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Description Textarea -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <textarea matInput rows="4" placeholder="Describe the place..." 
        [formControl]="form.controls.description"
        ></textarea>
      </mat-form-field>

      <!-- Image URL Input -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Image URL</mat-label>
        <input matInput placeholder="https://example.com/image.jpg">
      </mat-form-field>

  
        <!-- <input type="file"   placeholder="upload file"
        (change)="selectedFile($event)"
        formControlName="file"
        > -->
    

      <!-- Submit Button -->
      <div class="form-actions">
        <button mat-raised-button color="primary" type="submit">
          Add Place
        </button>
      </div>

    </form>
  </mat-card-content>
</mat-card>
